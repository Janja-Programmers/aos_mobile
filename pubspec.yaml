name: ownashop
description: "Multivendor Application."
publish_to: "none" # Set to "none" for private projects

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ------------------ UI & Design ------------------
  cupertino_icons: ^1.0.8

  # ------------------ State Management ------------------
  provider: ^6.1.5

  # ------------------ Routing ------------------
  go_router: ^16.0.0

  # ------------------ Local Storage ------------------
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0+1

  # ------------------ Database ------------------
  sqflite: ^2.4.2
  path: ^1.9.1
  sqlite_viewer2: ^2.0.0

  # ------------------ API & Networking ------------------
  dio: ^5.4.3+1

  # ------------------ Dependecy Injection ------------------
  get_it: ^8.0.3

  # ------------------ File Access & Permissions ------------------
  file_picker: ^10.2.0
  permission_handler: ^12.0.0+1

  # ------------------ Functional & Utility Libraries ------------------
  collection: ^1.19.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  url_launcher: ^6.3.1
  flutter_html: ^3.0.0
  chewie: ^1.7.1
  video_player: ^2.7.1
  logger: ^2.5.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.2.0
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.2
  fl_chart: ^1.0.0
  intl: ^0.20.2
  carousel_slider: ^5.1.1
  photo_view: ^0.15.0
  device_info_plus: ^11.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icons & splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_transparent.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.jpg"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo_transparent.png
  android: true
  ios: true
  fullscreen: true
