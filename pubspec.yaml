name: africaonlinestores
description: "Africa Online Stores"

publish_to: "none"

version: 1.0.0+8

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # ─────────────────── UI & Design ───────────────────
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3

  # ─────────────────── State Management ───────────────────
  flutter_riverpod: ^3.2.1

  # ─────────────────── Networking ───────────────────
  dio: ^5.9.0

  # ─────────────────── Navigation & Routing ───────────────────
  go_router: ^17.0.1

  # ─────────────────── Local Storage & Persistence ───────────────────
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  image_picker: ^1.2.1
  google_sign_in: ^7.2.0
  image: ^4.8.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.0.0
  video_player: ^2.10.1
  chewie: ^1.13.0
  speech_to_text: ^7.3.0
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5
  image_cropper: ^11.0.0
  http: ^1.6.0
  intl: ^0.20.2
  equatable: ^2.0.8
  sign_in_with_apple: ^7.0.1
  flutter_image_compress: ^2.4.0
  logger: ^2.7.0
  file_picker: ^10.3.10
  socket_io_client: ^3.1.4
  livekit_client: ^2.7.0
  url_launcher: ^6.3.2
  just_audio: ^0.10.5
  record: ^6.2.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_animate: ^4.5.2
  firebase_messaging: ^16.2.0
  firebase_core: ^4.7.0
  flutter_local_notifications: ^21.0.0
  uuid: ^4.5.3
  flutter_slidable: ^4.0.3
  flutter_callkit_incoming: ^3.0.0
  cached_network_image: ^3.4.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_lint: ^3.0.0-dev.4
  flutter_native_splash: ^2.4.7

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logo.png
    - assets/images/welcome.png
    - assets/images/aos_logo.png
    - assets/images/logo_redone.png
    - assets/icons/app_icon.png
    - assets/icons/google.svg
    - assets/audio/call_ringback.mp3

