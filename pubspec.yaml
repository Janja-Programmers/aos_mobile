name: ownashop
description: "Multivendor Application."
publish_to: "none" # Set to "none" for private projects

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  # ------------------ UI & Design ------------------
  cupertino_icons: ^1.0.8

  # ------------------ State Management ------------------
  provider: ^6.1.5

  # ------------------ Routing ------------------
  go_router: ^15.1.2

  # ------------------ Local Storage ------------------
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0+1

  # ------------------ Database ------------------
  sqflite: ^2.4.2
  path: ^1.9.1
  sqlite_viewer2: ^2.0.0

  # ------------------ API & Networking ------------------
  dio: ^5.4.3+1

  # ------------------ Dependecy Injection ------------------
  get_it: ^7.6.0

  # ------------------ File Access & Permissions ------------------
  file_picker: ^10.1.9
  permission_handler: ^12.0.0+1

  # ------------------ Functional & Utility Libraries ------------------
  collection: ^1.19.1
  equatable: ^2.0.5
  dartz: ^0.10.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icons & splash
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.0

  # ------------------ Logging ------------------
  logger: ^2.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/logo_transparent.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo_transparent.png"

flutter_native_splash:
  color: "#ffffff"
  image: assets/logo_transparent.png
  android: true
  ios: true
  fullscreen: true
